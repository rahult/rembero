name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify preinstalled SQLite toolchain
        run: sqlite3 --version && test -f /usr/include/sqlite3ext.h
      - run: npm ci
      - run: npm run build:sqlite
      - run: npm run build
      - run: npm test
      - if: matrix.node == 24
        run: npm run test:package
      - if: matrix.node == 24
        run: npm run bench:memory:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:install:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:million
      - if: matrix.node == 24
        working-directory: site
        run: npm ci --ignore-scripts
      - if: matrix.node == 24
        working-directory: site
        run: npm test
      - if: matrix.node == 24
        working-directory: site
        run: npm run lint

  clean-install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench:agent-db:install:check
