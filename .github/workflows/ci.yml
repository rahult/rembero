name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - run: npm ci
      - run: npm run build:sqlite
      - run: npm run build
      - run: npm test
      - if: matrix.node == 24
        run: npm run test:package
      - if: matrix.node == 24
        run: npm run bench:memory:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:install:check
      - if: matrix.node == 24
        run: npm run bench:agent-db:million
      - if: matrix.node == 24
        working-directory: site
        run: npm ci --ignore-scripts
      - if: matrix.node == 24
        working-directory: site
        run: npm test
      - if: matrix.node == 24
        working-directory: site
        run: npm run lint
